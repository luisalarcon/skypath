name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STATICCHECK_VERSION: 2026.2.2

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out | tail -n 1

  stack:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: skypath-ci
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check endpoints
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:3000/healthz
          curl -fsS -o /dev/null -w "frontend / -> %{http_code}\n" http://localhost:3000/

      - name: Search through the running API
        run: |
          # The reference result for this route is 27 itineraries.
          curl -fsS "http://localhost:8080/api/v1/search?origin=JFK&destination=LAX&date=2024-03-15" \
            | grep -q '"count":27'
          # Invalid input must be a 400, not a 200 with an empty list.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:8080/api/v1/search?origin=XXX&destination=LAX&date=2024-03-15")" = "400"

      - name: Search through the web application
        run: |
          curl -fsS -o /dev/null "http://localhost:3000/?origin=JFK&destination=LAX&date=2024-03-15"
          # A 400 here can only come from the API's validation, so it proves
          # the frontend reached the backend.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            "http://localhost:3000/?origin=XXX&destination=LAX&date=2024-03-15")" = "400"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans
