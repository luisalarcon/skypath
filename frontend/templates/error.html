{{define "error"}}<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "site-header"}}
  <main id="main" class="shell error-page" tabindex="-1">
    {{with .Status}}<p class="error-page__status">Error {{.}}</p>{{end}}
    <h1 class="error-page__heading">{{.Heading}}</h1>
    {{with .Message}}<p class="error-page__message">{{.}}</p>{{end}}
    <p class="error-page__action">
      <a class="button button--primary" href="/">Back to search</a>
    </p>
  </main>
{{template "site-footer"}}
</body>
</html>
{{end}}
