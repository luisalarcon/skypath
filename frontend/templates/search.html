{{define "search"}}<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "site-header"}}
  <main id="main" class="shell" tabindex="-1">
    <section class="search" aria-labelledby="search-title">
      <h1 id="search-title" class="search__title">Find a flight connection</h1>
      <div class="search__panel">
        {{template "search-form" .}}
      </div>
    </section>

    <div class="results" id="results">
      {{- if .Results}}{{template "results" .}}{{end}}
    </div>
  </main>
{{template "site-footer"}}
  <script src="/static/js/app.js?v={{.AssetVersion}}" defer></script>
</body>
</html>
{{end}}
